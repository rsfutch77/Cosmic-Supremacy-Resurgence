<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosmic Supremacy: Resurgence</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="win">
  <div class="top pywebview-drag-region">
    <img src="art/MAINWINDOWBORDERUPPERLEFT.png" width="64" height="80" alt="">
    <div class="ttl"><div class="ttl-text" id="product">Cosmic Supremacy: Resurgence</div></div>
    <img src="art/MAINWINDOWBORDERUPPERSTRETCHL.png" width="100" height="80" alt="">
    <div class="tstretch"></div>
    <div class="tright"></div>
  </div>
  <button class="tb tb-min" aria-label="Minimize" data-act="minimize"></button>
  <button class="tb tb-close" aria-label="Close" data-act="close"></button>
  <nav class="tabs" aria-label="Pages">
    <button class="gbtn sel" data-page="home">Play</button>
    <button class="gbtn" data-page="galaxies">Galaxies</button>
    <button class="gbtn" data-page="log">Log</button>
    <div style="flex: 1"></div>
    <button class="gbtn" id="name-btn" data-act="change_name">set name</button>
    <button class="gbtn" id="account-btn" data-act="account">log in</button>
  </nav>

  <div class="mid">
    <div class="side">
      <img src="art/MAINWINDOWBORDERLEFTUPPER.png" width="12" height="20" alt="">
      <div class="lm"></div>
      <img src="art/MAINWINDOWBORDERLEFTLOWER.png" width="12" height="60" alt="">
    </div>
    <main>
      <section class="page on" id="page-home">
        <div>
          <div class="hdr">Play</div>
          <div id="modes"></div>
        </div>
        <div class="hint">Keep this window open while you play. It is the game server.</div>
      </section>

      <section class="page" id="page-galaxies">
        <div class="hdr">Galaxies</div>
        <div class="toolbar">
          <div class="source" id="games-status"></div>
          <div style="flex: 1"></div>
          <button class="gbtn small" data-act="refresh">Refresh</button>
        </div>
        <div class="tablebox">
          <div class="grid colhead" id="colhead"></div>
          <div id="grows"></div>
        </div>
        <div class="warnline" id="games-hint" hidden></div>
      </section>

      <section class="page" id="page-log">
        <div class="hdr">Log</div>
        <div class="toolbar">
          <div style="flex: 1"></div>
          <button class="gbtn small" id="log-refs-btn" data-act="log_refs" hidden>Log History</button>
          <button class="gbtn small" data-act="send_log">Send Log</button>
        </div>
        <pre class="logbox" id="log"></pre>
      </section>

      <div id="controls" hidden>
        <div class="hdr">Game</div>
        <div class="row">
          <div class="turn" id="turn-label"></div>
          <div style="flex: 1"></div>
          <div class="btnrow" id="control-btns"></div>
        </div>
      </div>
    </main>
    <div class="side">
      <img src="art/MAINWINDOWBORDERRIGHTUPPER.png" width="12" height="20" alt="">
      <div class="rm"></div>
      <img src="art/MAINWINDOWBORDERRIGHTLOWER.png" width="12" height="60" alt="">
    </div>
  </div>

  <div class="bottom">
    <img src="art/MAINWINDOWBORDERLOWERLEFT.png" width="194" height="41" alt="">
    <div class="bm"></div>
    <img src="art/MAINWINDOWBORDERLOWERRIGHT.png" width="194" height="41" alt="">
    <div class="status">
      <span id="st-build"></span>
      <span><span class="dot" id="st-dot"></span><span id="st-text">starting…</span></span>
      <span id="cap" hidden><span class="dot" id="cap-dot"></span><span id="cap-text"></span></span>
    </div>
  </div>

  <div class="scrim" id="scrim">
    <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dlg-top">
        <img src="art/WINDOWBORDERUPPERLEFT.png" width="35" height="39" alt="">
        <div class="dlg-title"><div id="dlg-title"></div></div>
        <div class="dlg-sock">
          <img src="art/WINDOWBORDERUPPERTITLER.png" width="39" height="39" alt="">
          <img src="art/WINDOWBORDERUPPERRIGHT.png" width="36" height="39" alt="">
          <button class="tb tb-close" aria-label="Close" id="dlg-x"></button>
        </div>
      </div>
      <div class="dlg-mid">
        <div class="dlg-side">
          <img src="art/WINDOWBORDERLEFTUPPER.png" width="12" height="42" alt="">
          <div class="lm"></div>
          <img src="art/WINDOWBORDERLEFTLOWER.png" width="12" height="48" alt="">
        </div>
        <div class="dlg-body">
          <div class="dlg-text" id="dlg-text"></div>
          <pre class="dlg-scroll" id="dlg-scroll" hidden></pre>
          <div class="dlg-refs" id="dlg-refs" hidden></div>
          <div class="dlg-fields" id="dlg-fields" hidden></div>
          <div class="dlg-error" id="dlg-error" role="alert" hidden></div>
          <div class="dlg-note" id="dlg-note" hidden></div>
          <div class="dlg-btns" id="dlg-btns"></div>
        </div>
        <div class="dlg-side">
          <img src="art/WINDOWBORDERRIGHTUPPER.png" width="12" height="42" alt="">
          <div class="rm"></div>
          <img src="art/WINDOWBORDERRIGHTLOWER.png" width="12" height="48" alt="">
        </div>
      </div>
      <div class="dlg-bot">
        <img src="art/WINDOWBORDERLOWERLEFT.png" width="60" height="12" alt="">
        <div class="bm"></div>
        <img src="art/WINDOWBORDERLOWERRIGHT.png" width="60" height="12" alt="">
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
